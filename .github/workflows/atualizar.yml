name: Atualizar dados e publicar

on:
  schedule:
    - cron: '17 * * * *'   # de hora em hora
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Dois passos de cache de proposito: o actions/cache versiona a entrada
      # pelo conjunto de "path", entao juntar os arquivos num passo so tornaria
      # invisiveis os caches antigos de historico.json e a serie diaria ja
      # acumulada se perderia. Este passo mantem o path original.
      - uses: actions/cache@v4
        with:
          path: historico.json
          key: historico-${{ github.run_id }}
          restore-keys: historico-

      # Estado dos lancamentos e feed de correcoes: base da comparacao entre
      # rodadas que alimenta o detector de redeclaracoes.
      - uses: actions/cache@v4
        with:
          path: |
            estado.json
            correcoes.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Coletar dados do TSE
        run: python coletar.py

      # Nao bloqueia a publicacao: se o TSE mandar algo estranho, o site
      # continua no ar e a divergencia fica registrada no log.
      - name: Auditar os valores
        continue-on-error: true
        run: python verificar.py

      - name: Montar o site
        run: |
          mkdir -p _site
          cp index.html estilo.css app.js dados.json agregados.json _site/
          cp historico.json correcoes.json _site/ 2>/dev/null || true
          cp -r detalhe _site/ 2>/dev/null || true
          # O GitHub Pages cacheia os assets por ~10 min. Carimbar o commit na
          # URL garante que um visitante recorrente pegue o CSS/JS novos.
          V=$(git rev-parse --short HEAD)
          sed -i "s|href=\"estilo.css\"|href=\"estilo.css?v=$V\"|; s|src=\"app.js\"|src=\"app.js?v=$V\"|" _site/index.html
          grep -o 'estilo.css?v=[a-f0-9]*' _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
