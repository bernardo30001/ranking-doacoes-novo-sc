name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testar cálculos e preservação de dados
        run: |
          node --test tests/modelo.test.cjs
          python -m unittest discover -s tests

      # Manter os paths separados preserva a compatibilidade dos caches antigos.
      - uses: actions/cache/restore@v4
        with:
          path: historico.json
          key: historico-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: historico-
      - uses: actions/cache/restore@v4
        with:
          path: |
            estado.json
            correcoes.json
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: estado-

      - name: Recuperar última publicação e histórico
        env:
          GH_TOKEN: ${{ github.token }}
        run: python recuperar.py

      - name: Coletar e conferir uma nova versão completa
        id: coleta
        continue-on-error: true
        run: python atualizar.py

      - name: Informar preservação da última coleta
        if: steps.coleta.outcome != 'success'
        run: |
          echo '::warning::Nova coleta não concluída. Publicando a última coleta completa, com data original e aviso no painel.'
          echo 'A nova coleta falhou. O site mantém os dados da última publicação completa, com a data original.' >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir e montar o site
        run: python publicar.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy

      # O detector só avança depois de uma coleta conferida e publicada.
      - uses: actions/cache/save@v4
        if: steps.coleta.outcome == 'success'
        with:
          path: historico.json
          key: historico-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: steps.coleta.outcome == 'success'
        with:
          path: |
            estado.json
            correcoes.json
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}

      # Alertas são independentes da publicação: falha no ntfy não tira o site do ar.
      - name: Enviar alertas das finanças do NOVO SC
        id: ntfy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alertas.py

      # Salva também após envio parcial ou timeout, para tentar apenas os pendentes.
      # Não contém tópico/token e não faz parte do GitHub Pages.
      - name: Preservar fila e recibos dos alertas
        if: always() && steps.ntfy.outcome != 'skipped' && hashFiles('alertas-estado.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: alertas-estado
          path: alertas-estado.json
          retention-days: 30
          overwrite: true
